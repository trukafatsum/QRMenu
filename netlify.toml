[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:frontend"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[template.environment]
  ADMIN_EMAIL = "Yönetici e-postanız (npm run admin:setup çıktısı)"
  ADMIN_PASSWORD_HASH = "npm run admin:setup ile üretilen salt:hash değeri; düz şifre girmeyin"
